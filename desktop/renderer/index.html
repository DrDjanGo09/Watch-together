<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Watch Together</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7-11-7z" fill="#fff" /></svg>
      </span>
      <h1>Watch Together</h1>
    </div>
    <p class="subtitle">Start a party and send the link to your family. No terminal, no setup.</p>

    <div class="card status-card">
      <div class="status-row">
        <span id="status-dot" class="status-dot idle"></span>
        <span id="status-text">Not running</span>
      </div>
      <button id="toggle-btn" type="button">Start Watch Party</button>
    </div>

    <div id="share-card" class="card share-card hidden">
      <h2>Share this with your family</h2>
      <img id="qr" alt="QR code for the party link" />
      <div class="link-row">
        <input id="link-input" type="text" readonly />
        <button id="copy-btn" type="button" class="secondary">Copy</button>
      </div>
      <button id="open-btn" type="button" class="link-btn">Open in browser</button>
    </div>

    <div id="rooms-card" class="card rooms-card hidden">
      <h2>Who's watching</h2>
      <ul id="rooms-list"></ul>
    </div>

    <div id="error-card" class="card error-card hidden">
      <p id="error-text"></p>
    </div>

    <details class="details">
      <summary>Technical details</summary>
      <pre id="log"></pre>
    </details>
  </div>
  <script src="app.js"></script>
</body>
</html>
